<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#475569"/></marker></defs><rect width="900" height="900" fill="white"/><g font-family="Arial" font-size="16" fill="#111827" stroke="#475569" stroke-width="1.5"><text x="450" y="30" text-anchor="middle" stroke="none" font-size="21" font-weight="bold">Мониторинг исполнения проекта</text><rect x="300" y="55" width="300" height="45" rx="20" fill="#dcfce7"/><text x="450" y="83" text-anchor="middle" stroke="none">Импорт утверждённого плана</text><path d="M450 100V125" marker-end="url(#a)"/><rect x="300" y="130" width="300" height="45" fill="#dbeafe"/><text x="450" y="158" text-anchor="middle" stroke="none">Ежедневная синхронизация</text><path d="M450 175V200" marker-end="url(#a)"/><polygon points="450,200 540,245 450,290 360,245" fill="#fef3c7"/><text x="450" y="241" text-anchor="middle" stroke="none">Данные</text><text x="450" y="260" text-anchor="middle" stroke="none">получены?</text><path d="M360 245H180V320" fill="none" marker-end="url(#a)"/><text x="250" y="232" stroke="none">Нет</text><rect x="55" y="325" width="250" height="60" fill="#fee2e2"/><text x="180" y="350" text-anchor="middle" stroke="none">3 повтора; сохранить старые</text><text x="180" y="370" text-anchor="middle" stroke="none">данные и отметить stale</text><path d="M540 245H720V320" fill="none" marker-end="url(#a)"/><text x="630" y="232" stroke="none">Да</text><rect x="595" y="325" width="250" height="60" fill="#dbeafe"/><text x="720" y="350" text-anchor="middle" stroke="none">Проверить данные</text><text x="720" y="370" text-anchor="middle" stroke="none">и рассчитать отклонения</text><path d="M180 385V420H450V445" fill="none" marker-end="url(#a)"/><path d="M720 385V420H450" fill="none"/><polygon points="450,445 540,490 450,535 360,490" fill="#fef3c7"/><text x="450" y="486" text-anchor="middle" stroke="none">Есть</text><text x="450" y="505" text-anchor="middle" stroke="none">отклонение?</text><path d="M360 490H180V565" fill="none" marker-end="url(#a)"/><rect x="55" y="570" width="250" height="70" fill="#ede9fe"/><text x="180" y="595" text-anchor="middle" stroke="none">Назначить ответственного;</text><text x="180" y="615" text-anchor="middle" stroke="none">пояснение, устранение,</text><text x="180" y="633" text-anchor="middle" stroke="none">проверка ведомством</text><path d="M540 490H720V565" fill="none" marker-end="url(#a)"/><rect x="595" y="570" width="250" height="70" fill="#dbeafe"/><text x="720" y="595" text-anchor="middle" stroke="none">При необходимости</text><text x="720" y="615" text-anchor="middle" stroke="none">предложить новый статус;</text><text x="720" y="633" text-anchor="middle" stroke="none">получить подтверждение</text><path d="M180 640V680H450V710" fill="none" marker-end="url(#a)"/><path d="M720 640V680H450" fill="none"/><rect x="300" y="715" width="300" height="50" rx="20" fill="#dcfce7"/><text x="450" y="746" text-anchor="middle" stroke="none">Отчётность и аудит</text><text x="450" y="820" text-anchor="middle" stroke="none" font-size="13">Учебная схема, детали интеграций уточняются</text></g></svg>
